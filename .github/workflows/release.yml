# Genera el instalador .exe de Windows y lo publica en un GitHub Release.
#
# Uso:   git tag v1.1.0 && git push origin v1.1.0
# (o desde la pestaña Actions -> "release" -> Run workflow, que solo sube el .exe como artefacto)
#
# NOTA: este workflow no se pudo probar localmente (se escribió sin acceso a Windows).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Verificar que el EULA no tenga campos sin completar
        shell: bash
        run: |
          if grep -n "COMPLETAR" EULA.txt; then
            echo "::error::EULA.txt todavía tiene campos [COMPLETAR: ...]. Completalos antes de publicar."
            exit 1
          fi

      - name: Configurar
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DEFRT_BUILD_TESTS=OFF -DEFRT_COPY_AFTER_BUILD=OFF

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compilar instalador
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\EFRT.iss'

      - name: SHA-256
        shell: bash
        run: |
          cd dist
          sha256sum EFRT_Setup_*.exe | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: EFRT-Setup
          path: dist/*

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EFRT_Setup_*.exe
            dist/SHA256SUMS.txt
